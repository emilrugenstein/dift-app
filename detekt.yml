# Detekt configuration — builds upon the default ruleset (buildUponDefaultConfig = true in app/build.gradle.kts).
# Only deviations from the defaults live here. Style authority for the whole repo.

build:
  maxIssues: 0

style:
  MagicNumber:
    active: false # UI code is full of harmless literals; correctness constants get named anyway
  ReturnCount:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

complexity:
  LongMethod:
    threshold: 120 # Compose screen functions are long by nature
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true # data-class models and test builders lean on defaults
    # Hilt @Inject constructors list collaborators, not call-site burden.
    ignoreAnnotated: ['Composable', 'Inject']
  TooManyFunctions:
    thresholdInInterfaces: 20 # Room DAOs legitimately have many query methods
    thresholdInClasses: 20
    ignoreAnnotatedFunctions: ['Preview']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable'] # Composables are PascalCase by convention

exceptions:
  TooGenericExceptionCaught:
    active: false
