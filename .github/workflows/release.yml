# Release: push a tag `vX.Y.Z` -> signed APK attached to a GitHub Release.
# Obtainium on the phone watches these releases and installs updates in place.
#
# Required repository secrets (see docs/RELEASING.md for setup):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# NEVER rotate the keystore: a changed signature forces uninstall = data loss on the phone.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PversionName="$VERSION" --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "dift-v${VERSION}.apk"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: dift-v*.apk
          generate_release_notes: true
